apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubernetes-work
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-work-web
  template:
    metadata:
      labels:
        app: kubernetes-work-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: web-content
