apiVersion: v1
kind: ConfigMap
metadata:
  name: config-demo
  namespace: kubernetes-work
data:
  APP_MODE: learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
  namespace: kubernetes-work
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36.1
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: config-demo
            - secretRef:
                name: app-credentials
