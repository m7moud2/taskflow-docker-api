apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: kubernetes-work
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kubernetes Work</title>
      </head>
      <body>
        <h1>Hello from Kubernetes!</h1>
        <p>You deployed this page with a ConfigMap, Deployment, and Service.</p>
      </body>
    </html>
