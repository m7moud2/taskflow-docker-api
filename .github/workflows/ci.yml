name: DevOps Docker Compose & Monitoring CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docker-compose:
    name: Validate Docker Stacks & Monitoring Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Master Docker Compose
        run: docker compose config

      - name: Validate Nginx Monitoring Stack Compose
        run: docker compose -f docker-compose.nginx.yml config

      - name: Validate WordPress Monitoring Stack Compose
        run: docker compose -f docker-compose.wordpress.yml config
