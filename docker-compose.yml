version: '3.8'

# Default Master Entrypoint: Nginx Web Server + Monitoring Stack
# To run WordPress Stack instead, execute:
#   docker compose -f docker-compose.wordpress.yml up -d

services:
  nginx_server:
    image: nginx:alpine
    container_name: taskflow_nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/stub_status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - monitoring_net
    restart: unless-stopped

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: taskflow_nginx_exporter
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx_server:80/stub_status
    depends_on:
      nginx_server:
        condition: service_healthy
    networks:
      - monitoring_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskflow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-nginx.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.nginx.yml:/etc/prometheus/alert.rules.nginx.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring_net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taskflow_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - monitoring_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: taskflow_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_secret
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/nginx-dashboard.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    restart: unless-stopped

networks:
  monitoring_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
