services:
  app:
    image: docker-kubernetes-bridge:1.0.0
    build:
      context: .
      args:
        APP_VERSION: 1.0.0
    container_name: docker-kubernetes-bridge
    ports:
      - "8088:8080"
    environment:
      RUNTIME: docker
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped
