apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-app
  namespace: docker-kubernetes-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge-app
  template:
    metadata:
      labels:
        app: bridge-app
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/docker-kubernetes-bridge:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUNTIME
              value: kubernetes
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
